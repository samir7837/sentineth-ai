services:
  postgres:
    image: postgres:17
    container_name: sentineth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sentineth
      POSTGRES_PASSWORD: sentineth_dev_password
      POSTGRES_DB: sentineth

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineth -d sentineth"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pinned to match qdrant-client==1.19.0 in requirements.txt.
  # Mismatched client/server versions emit a compatibility warning
  # at startup - keep these two in step. See AGENTS.md section 15.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: sentineth-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
